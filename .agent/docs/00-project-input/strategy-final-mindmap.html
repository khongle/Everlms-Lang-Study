function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(node, color){
  const c = node.color || color || '#555';
  const st = document.createElement('div'); st.className='st';
  const nd = document.createElement('div'); nd.className='nd'; nd.style.setProperty('--c', c);
  let h='';
  if(node.c && node.c.length) h+='<span class="tog">▾</span>';
  h+='<span class="ttl">'+esc(node.t)+'</span>';
  if(node.tag) h+='<span class="tag">'+esc(node.tag)+'</span>';
  if(node.n) h+='<span class="note">'+esc(node.n)+'</span>';
  nd.innerHTML=h; st.appendChild(nd);
  if(node.c && node.c.length){
    nd.classList.add('has');
    const kids=document.createElement('div'); kids.className='kids'; kids.style.setProperty('--c', c);
    node.c.forEach(ch=>kids.appendChild(render(ch, c)));
    st.appendChild(kids);
    nd.addEventListener('click',()=>{ st.classList.toggle('collapsed');
      nd.querySelector('.tog').textContent = st.classList.contains('collapsed')?'▸':'▾'; });
  }
  return st;
}
const rootSt = render(DATA);
rootSt.classList.add('root');
document.getElementById('tree').appendChild(rootSt);

function syncTogs(){ document.querySelectorAll('.st').forEach(s=>{ const t=s.querySelector(':scope>.nd>.tog');
  if(t) t.textContent = s.classList.contains('collapsed')?'▸':'▾'; }); }
function expandAll(){ document.querySelectorAll('.st').forEach(s=>s.classList.remove('collapsed')); syncTogs(); }
function collapseAll(){ document.querySelectorAll('.st').forEach(s=>{ if(s.querySelector(':scope>.kids') && !s.classList.contains('root')) s.classList.add('collapsed'); }); syncTogs(); }

const q=document.getElementById('q');
function filter(st, query){
  const nd=st.querySelector(':scope>.nd');
  const text=nd.textContent.toLowerCase();
  const kids=st.querySelector(':scope>.kids');
  let childHit=false;
  if(kids) [...kids.children].forEach(c=>{ if(c.classList.contains('st') && filter(c,query)) childHit=true; });
  const self=query && text.includes(query);
  const vis = !query || self || childHit;
  st.style.display = vis?'':'none';
  nd.classList.toggle('hit', !!self);
  if(query && childHit) st.classList.remove('collapsed');
  return vis;
}
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); filter(rootSt, v); if(!v) syncTogs(); });

collapseAll();   // mở mặc định: root + 9 nhánh; bấm node để xổ, hoặc "Mở hết"
