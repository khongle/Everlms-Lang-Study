<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap — Phân rã Website / Web App</title>
<style>
  :root{ --bg:#f6f4ef; --ink:#23262f; --muted:#6b7180; --line:#cfcabe; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:10;background:rgba(246,244,239,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:.8rem}
  .tools{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:.4rem .7rem;cursor:pointer}
  button:hover{border-color:#999}
  #q{font:inherit;padding:.4rem .7rem;border:1px solid var(--line);border-radius:8px;width:200px}
  .legend{font-size:.75rem;color:var(--muted)}
  .legend b{color:#b8860b}
  .stage{overflow:auto;padding:2rem 1.2rem 4rem}
  /* tree */
  .st{display:flex;align-items:center}
  .nd{position:relative;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c,#555);
    border-radius:10px;padding:.5rem .8rem;margin:.28rem 0;box-shadow:0 1px 2px rgba(20,25,40,.05);
    max-width:340px;line-height:1.3;flex:0 0 auto}
  .nd.has{cursor:pointer}
  .nd.has:hover{box-shadow:0 2px 10px rgba(20,25,40,.12)}
  .nd .tog{display:inline-block;width:1em;color:var(--c,#555);font-weight:700;margin-right:.15rem}
  .nd .ttl{font-weight:600}
  .nd .tag{font-size:.66rem;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--c,#555);
    border-radius:999px;padding:.05rem .45rem;margin-left:.35rem;white-space:nowrap;vertical-align:middle}
  .nd .note{display:block;font-size:.74rem;color:var(--muted);margin-top:.15rem}
  .nd.hit{outline:3px solid #ffd24d;outline-offset:1px}
  .kids{display:flex;flex-direction:column;margin-left:26px;padding-left:22px;position:relative;
    border-left:2px solid color-mix(in srgb,var(--c,#999) 40%,#d4cfc4)}
  .kids>.st>.nd::before{content:'';position:absolute;left:-24px;top:50%;width:22px;height:2px;
    background:color-mix(in srgb,var(--c,#999) 40%,#d4cfc4)}
  .st.collapsed>.kids{display:none}
  .root>.nd{font-size:1.05rem;border-left-width:7px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Mindmap — Phân rã Website / Web App</h1>
    <div class="sub">top‑down: site → page → section → block → element → field → value → atom · bấm node để mở/thu</div>
  </div>
  <div class="tools">
    <input id="q" placeholder="Tìm trong mindmap…">
    <button onclick="expandAll()">Mở hết</button>
    <button onclick="collapseAll()">Thu về nhánh</button>
    <span class="legend">Tag <b>★</b> = đã lưu trong <code>_units/</code></span>
  </div>
</header>
<div class="stage"><div id="tree"></div></div>

<script>
const DATA = {t:"WEBSITE / WEB APP", color:"#222", c:[
 {t:"① STRUCTURE — cây cấu trúc (DOM)", color:"#2f5597", c:[
   {t:"Web Property", n:"hệ hiện diện web của 1 tổ chức", c:[
     {t:"Brand / ngôn ngữ thiết kế dùng chung"},
     {t:"Domains / subdomains"},
     {t:"Nhiều Site / App"}
   ]},
   {t:"Site / Web App", tag:"= prototype ★", n:"một site hoàn chỉnh", c:[
     {t:"Global config", c:[
       {t:"theme + design tokens"},{t:"font, favicon"},
       {t:"meta mặc định, robots, sitemap"},{t:"i18n locales"},
       {t:"analytics, auth, feature flags"}]},
     {t:"Global chrome (khung site)", c:[
       {t:"header (topbar + nav)"},{t:"footer"},{t:"skip-link"},
       {t:"cookie / consent"},{t:"offcanvas"}]},
     {t:"Routing & IA", c:[
       {t:"bản đồ URL"},{t:"primary menu"},{t:"footer menu"},{t:"breadcrumb"}]},
     {t:"Site behaviors (JS toàn cục)", c:[
       {t:"menu toggle"},{t:"scroll-spy"},{t:"theme switch"},{t:"lazy-load"}]},
     {t:"Page / Route / View", tag:"★ pages/", n:"một URL / màn hình", c:[
       {t:"page_type", c:[
         {t:"home, about, services, pricing"},
         {t:"contact, faq, gallery, team, blog, process…"}]},
       {t:"layout template"},
       {t:"SEO meta (title, desc, og, canonical)"},
       {t:"page state: loading / empty / error (web app)"},
       {t:"Region", tag:"Drupal region", n:"vùng bố cục", c:[
         {t:"header_top · header · header_bottom"},
         {t:"content_top · content · content_bottom"},
         {t:"sidebar_first · sidebar_second"},
         {t:"footer_top · footer · footer_bottom"},
         {t:"Section", tag:"★ sections/ · organism", n:"dải ngang", c:[
           {t:"section_type (hero, stats, feature-grid, gallery, faq, form, cta…)"},
           {t:"layout (số cột, grid / flex)"},
           {t:"background, container width, spacing"},
           {t:"Block / Component", tag:"★ blocks/ · molecule · SDC", n:"đơn vị nguyên tử tái dùng", c:[
             {t:"block_type (card, stat, nav, form, logo, testimonial, faq-item, price-tier…)"},
             {t:"variant / skin"},
             {t:"props / slots (chỗ nhận dữ liệu)"},
             {t:"Element", tag:"atom (HTML)", c:[
               {t:"heading · paragraph · image · icon (svg)"},
               {t:"button · link · input · label"},
               {t:"list · list-item · table cell · badge · figure"},
               {t:"Field / Slot", tag:"Drupal field", n:"lỗ nhận dữ liệu", c:[
                 {t:"text · long / rich text"},
                 {t:"image (src + alt) · link (href + label)"},
                 {t:"number · boolean · date"},
                 {t:"reference (entity / taxonomy) · options · file · color"},
                 {t:"Value / Content", n:"dữ liệu thật điền vào", c:[
                   {t:"chuỗi · số · file ảnh · URL · ngày"},
                   {t:"Atom / Primitive", tag:"NHỎ NHẤT", n:"không tách được nữa", c:[
                     {t:"1 token (màu #hex, font, size, spacing, radius, shadow)"},
                     {t:"1 khai báo CSS (property: value)"},
                     {t:"1 thuộc tính DOM (attribute)"},
                     {t:"1 ký tự / glyph · 1 pixel · 1 keyframe"}
                   ]}
                 ]}
               ]}
             ]}
           ]}
         ]}
       ]}
     ]}
   ]}
 ]},
 {t:"② DESIGN SYSTEM (style)", color:"#843c0c", c:[
   {t:"Theme"},
   {t:"Tokens", c:[{t:"color"},{t:"typography"},{t:"spacing"},{t:"radius"},{t:"shadow"},{t:"motion"},{t:"breakpoint"}]},
   {t:"Primitive values (#hex, rem, ms…)"}
 ]},
 {t:"③ BEHAVIOR (tương tác)", color:"#7a5b00", c:[
   {t:"Global scripts"},{t:"Component behavior"},{t:"Event / handler"},
   {t:"Transition / animation"},{t:"Validation"},{t:"State"}
 ]},
 {t:"④ CONTENT / DATA (dữ liệu)", color:"#375623", c:[
   {t:"Entity / Model"},{t:"Content type"},
   {t:"Field type", c:[{t:"text, long text, image, link"},{t:"number, bool, date, reference, options, file, color"}]},
   {t:"Taxonomy / term"},{t:"Value"}
 ]},
 {t:"⑤ NAVIGATION / IA", color:"#1f6f6f", c:[
   {t:"Menu (primary / footer / utility)", c:[{t:"menu item"},{t:"link"}]},
   {t:"Route map"},{t:"Breadcrumb"},{t:"Sitemap"}
 ]},
 {t:"⑥ APP LAYER (web app, chiều động)", color:"#6b2fb3", c:[
   {t:"Data & API", c:[{t:"entity / schema"},{t:"endpoint, query, mutation"},{t:"cache / store"}]},
   {t:"State management", c:[{t:"global · route · local · form · server"}]},
   {t:"Flow / Journey", c:[{t:"signup, checkout, booking, onboarding"},{t:"step → screen → field → validation"}]},
   {t:"Business logic (rule, role, computed)"},
   {t:"Services (auth, payment, search, i18n, flags)"}
 ]},
 {t:"⑦ CROSS-CUTTING (xuyên suốt)", color:"#a3334d", c:[
   {t:"Accessibility (landmark, aria, contrast)"},{t:"Responsive (breakpoint)"},
   {t:"SEO / meta"},{t:"Performance"},{t:"i18n / localization"},
   {t:"Analytics / events"},{t:"Security / permission"}
 ]}
]};

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(node, color){
  const c = node.color || color || '#555';
  const st = document.createElement('div'); st.className='st';
  const nd = document.createElement('div'); nd.className='nd'; nd.style.setProperty('--c', c);
  let h='';
  if(node.c && node.c.length) h+='<span class="tog">▾</span>';
  h+='<span class="ttl">'+esc(node.t)+'</span>';
  if(node.tag) h+='<span class="tag">'+esc(node.tag)+'</span>';
  if(node.n) h+='<span class="note">'+esc(node.n)+'</span>';
  nd.innerHTML=h; st.appendChild(nd);
  if(node.c && node.c.length){
    nd.classList.add('has');
    const kids=document.createElement('div'); kids.className='kids'; kids.style.setProperty('--c', c);
    node.c.forEach(ch=>kids.appendChild(render(ch, c)));
    st.appendChild(kids);
    nd.addEventListener('click',()=>{ st.classList.toggle('collapsed');
      nd.querySelector('.tog').textContent = st.classList.contains('collapsed')?'▸':'▾'; });
  }
  return st;
}
const rootSt = render(DATA);
rootSt.classList.add('root');
document.getElementById('tree').appendChild(rootSt);

function syncTogs(){ document.querySelectorAll('.st').forEach(s=>{ const t=s.querySelector(':scope>.nd>.tog');
  if(t) t.textContent = s.classList.contains('collapsed')?'▸':'▾'; }); }
function expandAll(){ document.querySelectorAll('.st').forEach(s=>s.classList.remove('collapsed')); syncTogs(); }
function collapseAll(){ document.querySelectorAll('.st').forEach(s=>{ if(s.querySelector(':scope>.kids') && !s.classList.contains('root')) s.classList.add('collapsed'); }); syncTogs(); }

const q=document.getElementById('q');
function filter(st, query){
  const nd=st.querySelector(':scope>.nd');
  const text=nd.textContent.toLowerCase();
  const kids=st.querySelector(':scope>.kids');
  let childHit=false;
  if(kids) [...kids.children].forEach(c=>{ if(c.classList.contains('st') && filter(c,query)) childHit=true; });
  const self=query && text.includes(query);
  const vis = !query || self || childHit;
  st.style.display = vis?'':'none';
  nd.classList.toggle('hit', !!self);
  if(query && childHit) st.classList.remove('collapsed');
  return vis;
}
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); filter(rootSt, v); if(!v) syncTogs(); });

collapseAll();   // mở mặc định: root + 7 nhánh; bấm node để xổ, hoặc "Mở hết"
</script>
</body>
</html>
