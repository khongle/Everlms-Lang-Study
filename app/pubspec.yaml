name: everlms
description: A product of Weebpal.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# of the product and file versions while build-number is used as the build suffix.
version: 1.0.10+33

environment:
  sdk: '>=3.0.1 <4.0.0'

dependencies:
  archive: ^3.3.0
  audio_video_progress_bar: ^2.0.3
  audioplayers: ^6.5.1
  badges: ^3.1.2
  better_player_plus: ^1.0.5
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  convert_vietnamese: ^0.0.9
  country_code_picker: ^3.3.0
  country_pickers: ^3.0.1
  dart_jsonwebtoken: ^2.14.0
  device_info_plus: ^11.2.0
  dio: ^5.7.0
  email_validator: ^3.0.0
  file_picker: ^8.0.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  flutter_downloader: ^1.11.1
  flutter_facebook_auth: ^7.1.2
  flutter_html: ^3.0.0-beta.2
  flutter_inappwebview: ^6.1.4
  flutter_local_notifications: ^17.2.1+1
  flutter_localizations:
    sdk: flutter
  flutter_pdfview: ^1.4.4
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^2.6.1
  flutter_stripe: ^10.2.0
  flutter_svg: ^2.0.10+1
  flutter_switch: ^0.3.2
  go_router: ^14.6.2
  google_sign_in: ^5.2.1
  html: ^0.15.4
  http: ^1.4.0
  http_server: ^1.0.0
  image_picker: ^1.2.0
  in_app_purchase: ^3.2.1
  in_app_purchase_storekit: any
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  lottie: 3.3.0
  msal_auth: ^3.3.0
  open_filex: ^4.7.0
  package_info_plus: ^8.3.1
  path: ^1.0.0
  path_provider: ^2.1.5
  paypal_payment: ^1.0.0+4
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  shimmer_animation: ^2.1.0+1
  url_launcher: ^6.1.3
  vimeo_video_player: ^1.0.1
  xml: ^6.5.0
  youtube_player_flutter: ^9.1.1
dependency_overrides:
  flutter_widget_from_html_core: ^0.15.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  test: any
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/logo/logo.png'
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  generate: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/languages/
    - assets/images/notification/
    - assets/logo/
    - assets/logo_EverLMS/SVG/
    - assets/images/intro/
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700