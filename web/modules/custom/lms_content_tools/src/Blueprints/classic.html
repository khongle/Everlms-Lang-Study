<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn (Dùng font Serif hoàng gia) -->
<div style="font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa -->
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 42pt; font-weight: bold; margin: 0 0 5px 0; color: #1e3a8a; text-transform: uppercase;">
            CERTIFICATE OF EXCELLENCE
        </h1>
        <div style="font-size: 16pt; letter-spacing: 5px; color: #b4975a; text-transform: uppercase;">
            Proudly Presented To
        </div>
    </div>

    <!-- Nội dung chứng chỉ -->
    <div style="text-align: center; margin-bottom: 45px;">
        <p style="font-size: 28pt; font-weight: bold; font-style: italic; color: #0f172a; margin-bottom: 20px;">
            [student_name]
        </p>
        <p style="font-size: 16pt; line-height: 1.6; color: #334155; margin: 0 30px;">
            For the successful completion of <strong>[course_name]</strong> on <strong>[issue_date]</strong>, 
            demonstrating exceptional academic performance and theoretical proficiency.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) & Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu (Seal) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Phải: Chữ ký (Signature) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #b4975a; width: 230px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 18pt; color: #0f172a; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #b4975a; font-weight: bold; text-transform: uppercase;">
                        Date of Issue
                    </div>
                </div>
            </td>
            <!-- Cột Phải: Chữ ký -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #b4975a; width: 280px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 13pt; color: #1e293b; font-weight: bold; text-transform: uppercase; margin-bottom: 2px;">
                        ACADEMIC DIRECTOR
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic;">
                        Authorized Signature
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
