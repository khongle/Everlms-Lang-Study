<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn -->
<div style="font-family: 'Times New Roman', Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa (Giật cấp 2 màu Navy & Đỏ) -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 44pt; font-weight: bold; margin: 0; color: #1e3a8a; text-transform: uppercase; letter-spacing: 3px;">
            CERTIFICATE
        </h1>
        <h2 style="font-size: 38pt; font-weight: normal; margin: 0 0 10px 0; color: #dc2626; text-transform: uppercase; letter-spacing: 2px;">
            COMPLETION
        </h2>
        <div style="border-bottom: 2px solid #1e3a8a; width: 350px; margin: 0 auto;"></div>
    </div>

    <!-- Nội dung chứng chỉ -->
    <div style="text-align: center; margin-bottom: 40px;">
        <p style="font-size: 16pt; line-height: 1.8; color: #334155; margin: 0 40px;">
            Recognizing the achievement of <strong style="color: #1e3a8a; font-size: 20pt; font-style: italic;">[student_name]</strong> 
            in acquiring specialized skills through the <strong style="color: #1e3a8a;">[course_name]</strong> program on <strong>[issue_date]</strong>. 
            <br>Outstanding performance.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) & Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu (Seal) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Phải: Chữ ký (Signature) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp & ID -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #1e3a8a; width: 230px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 16pt; color: #1e3a8a; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #dc2626; font-weight: bold; text-transform: uppercase;">
                        Date of Issue
                    </div>
                    <div style="font-size: 9pt; color: #64748b; margin-top: 4px;">
                        CREDENTIAL ID: [certificate_code]
                    </div>
                </div>
            </td>
            <!-- Cột Phải: Chức Danh -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #1e3a8a; width: 280px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 12pt; color: #1e3a8a; font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">
                        Pediatric Nursing Guild
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic; text-transform: uppercase;">
                        Sarah Fischer, Program Coordinator
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
