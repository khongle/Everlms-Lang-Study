<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn -->
<div style="font-family: 'Times New Roman', Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa -->
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="font-size: 44pt; font-weight: bold; margin: 0 0 5px 0; color: #0d9488; text-transform: uppercase; letter-spacing: 2px;">
            CERTIFICATE
        </h1>
        <div style="font-size: 18pt; color: #0f172a; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px;">
            OF CLINICAL EXCELLENCE
        </div>
        <div style="border-bottom: 2px solid #0d9488; width: 350px; margin: 0 auto;"></div>
    </div>

    <!-- Nội dung chứng chỉ -->
    <div style="text-align: center; margin-bottom: 45px;">
        <p style="font-size: 16pt; line-height: 1.8; color: #334155; margin: 0 40px;">
            Congratulations <strong style="color: #0d9488; font-size: 20pt; font-style: italic;">[student_name]</strong>! 
            You have successfully completed the <strong style="color: #0f172a;">[course_name]</strong> workshop on <strong>[issue_date]</strong>. 
            <br>Your commitment to mental health advocacy is commended.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) | Icon y tế (Giữa) | Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu (Seal) -->
            <td width="33%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Giữa: Icon Y Tế nổi bật -->
            <td width="34%" align="center" valign="bottom" style="padding-bottom: 15px;">
                 <div style="width: 45px; height: 45px; margin: 0 auto 8px auto; border: 3px solid #0d9488; border-radius: 50%; display: table;">
                    <div style="display: table-cell; vertical-align: middle; font-size: 22px; color: #0d9488; font-weight: bold;">+</div>
                </div>
                 <div style="font-size: 10pt; color: #0d9488; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">
                    ID: [certificate_code]
                </div>
            </td>
            <!-- Cột Phải: Chữ ký (Signature) -->
            <td width="33%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp -->
            <td width="33%" align="center" valign="top">
                <div style="border-top: 2px solid #0d9488; width: 220px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 16pt; color: #0f172a; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #0d9488; font-weight: bold; text-transform: uppercase;">
                        Date
                    </div>
                </div>
            </td>
            <!-- Cột Giữa: Trống phân vách -->
            <td width="34%"></td>
            <!-- Cột Phải: Chức Danh -->
            <td width="33%" align="center" valign="top">
                <div style="border-top: 2px solid #0d9488; width: 250px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 12pt; color: #0f172a; font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">
                        Psychiatry Training Network
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic; line-height: 1.4;">
                        Prof. Dr. Elena Becker
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
