<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn -->
<div style="font-family: 'Times New Roman', Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa (Ngắt dòng cho sang trọng) -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 42pt; font-weight: bold; margin: 0 0 10px 0; color: #1e3a8a; text-transform: uppercase; letter-spacing: 2px;">
            CERTIFICATE OF<br>GRADUATION
        </h1>
        <div style="border-bottom: 2px solid #9f1239; width: 350px; margin: 0 auto;"></div>
    </div>

    <!-- Nội dung chứng chỉ (Định dạng in nghiêng nghệ thuật) -->
    <div style="text-align: center; margin-bottom: 50px;">
        <p style="font-size: 18pt; line-height: 1.8; color: #334155; margin: 0 40px; font-style: italic;">
            We hereby certify that <strong style="color: #1e3a8a; font-size: 22pt; font-style: normal;">[student_name]</strong> 
            has mastered the competencies required for <strong style="color: #1e3a8a; font-style: normal;">[course_name]</strong>. 
            <br>Issued on this day: <strong style="font-style: normal;">[issue_date]</strong>.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) | ID (Giữa) | Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu (Seal) -->
            <td width="33%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Giữa: Mã ID lơ lửng -->
            <td width="34%" align="center" valign="bottom" style="padding-bottom: 20px;">
                 <div style="font-size: 10pt; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">
                    ID: [certificate_code]
                </div>
            </td>
            <!-- Cột Phải: Chữ ký (Signature) -->
            <td width="33%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp dưới chân Mộc đỏ -->
            <td width="33%" align="center" valign="top">
                <div style="border-top: 2px solid #9f1239; width: 220px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 16pt; color: #1e3a8a; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #9f1239; font-weight: bold; text-transform: uppercase;">
                        Conferred On
                    </div>
                </div>
            </td>
            <!-- Cột Giữa: Trống để vách phân cách -->
            <td width="34%"></td>
            <!-- Cột Phải: Chức Danh dưới Chữ ký -->
            <td width="33%" align="center" valign="top">
                <div style="border-top: 2px solid #9f1239; width: 250px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 12pt; color: #1e3a8a; font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">
                        NeuroCare Academy
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic; line-height: 1.4;">
                        Tobias Richter,<br>Senior Neurologist
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
