<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn -->
<div style="font-family: 'Times New Roman', Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 42pt; font-weight: bold; margin: 0 0 5px 0; color: #1d4ed8; text-transform: uppercase; letter-spacing: 2px;">
            CERTIFICATE
        </h1>
        <div style="font-size: 18pt; color: #64748b; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 15px;">
            OF ACHIEVEMENT
        </div>
        <div style="border-bottom: 2px solid #b4975a; width: 350px; margin: 0 auto;"></div>
    </div>

    <!-- Nội dung chứng chỉ -->
    <div style="text-align: center; margin-bottom: 50px;">
        <p style="font-size: 16pt; line-height: 1.8; color: #334155; margin: 0 40px;">
            Awarded to <strong style="color: #1d4ed8; font-size: 20pt; font-style: italic;">[student_name]</strong> 
            for dedicated participation and successful graduation from the <strong style="color: #1d4ed8;">[course_name]</strong> 
            on <strong>[issue_date]</strong>. 
            <br>Deepest gratitude for empathy in service.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) & Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu (Seal) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Phải: Chữ ký Lớn (Signature) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp & ID -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #b4975a; width: 230px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 16pt; color: #1d4ed8; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #64748b; font-weight: bold; text-transform: uppercase;">
                        Official Date
                    </div>
                    <div style="font-size: 9pt; color: #94a3b8; margin-top: 4px;">
                        REF: [certificate_code]
                    </div>
                </div>
            </td>
            <!-- Cột Phải: Chức Danh -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #b4975a; width: 280px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 12pt; color: #1d4ed8; font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">
                        Palliative Foundation Germany
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic; text-transform: uppercase;">
                        Julia Wagner, Founder
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
