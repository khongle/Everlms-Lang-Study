<!-- Khung nội dung bảo vệ khoảng cách tuyệt đối an toàn -->
<div style="font-family: 'Times New Roman', Georgia, serif; position: absolute; top: 12%; bottom: 12%; left: 12%; right: 12%; z-index: 10;">
    
    <!-- HEADER: Logo Canh Giữa -->
    <div style="text-align: center; margin-bottom: 15px;">
        <img src="[logo]" height="130" style="width: auto; max-width: 250px;" alt="Logo" />
    </div>

    <!-- Tiêu đề Canh giữa -->
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 40pt; font-weight: bold; margin: 0 0 10px 0; color: #0f172a; text-transform: uppercase; letter-spacing: 2px;">
            CERTIFICATE OF COMPLETION
        </h1>
        <div style="border-bottom: 2px solid #7f1d1d; width: 350px; margin: 0 auto;"></div>
    </div>

    <!-- Nội dung chứng chỉ -->
    <div style="text-align: center; margin-bottom: 60px;">
        <p style="font-size: 16pt; line-height: 1.8; color: #334155; margin: 0 40px;">
            Presented to <strong style="color: #0f172a; font-size: 20pt; font-style: italic;">[student_name]</strong> upon fulfilling the 
            requirements of <strong style="color: #0f172a;">[course_name]</strong> with distinction on <strong>[issue_date]</strong>. 
            <br>This acknowledges their dedication to geriatric patient care.
        </p>
    </div>

    <!-- FOOTER: Con Dấu (Trái) & Chữ ký (Phải) -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 15px;">
        <tr>
            <!-- Cột Trái: Con dấu đỏ (Seal) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[seal]" height="150" style="width: auto;" alt="Seal" />
            </td>
            <!-- Cột Phải: Chữ ký Lớn (Signature) -->
            <td width="50%" align="center" valign="bottom" style="padding-bottom: 12px;">
                <img src="[signature]" height="130" style="width: auto;" alt="Signature" />
            </td>
        </tr>
        <tr>
            <!-- Cột Trái: Ngày cấp -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #7f1d1d; width: 230px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 16pt; color: #0f172a; margin-bottom: 2px;">
                        [issue_date]
                    </div>
                    <div style="font-size: 11pt; color: #7f1d1d; font-weight: bold; text-transform: uppercase;">
                        Date of Issue
                    </div>
                </div>
            </td>
            <!-- Cột Phải: Chức Danh -->
            <td width="50%" align="center" valign="top">
                <div style="border-top: 2px solid #7f1d1d; width: 280px; margin: 0 auto; padding-top: 5px;">
                    <div style="font-size: 12pt; color: #0f172a; font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">
                        German Nursing Quality Assurance
                    </div>
                    <div style="font-size: 11pt; color: #7f8c8d; font-style: italic; text-transform: uppercase;">
                        Anna Schmidt, Board Member
                    </div>
                </div>
            </td>
        </tr>
    </table>
    
</div>
