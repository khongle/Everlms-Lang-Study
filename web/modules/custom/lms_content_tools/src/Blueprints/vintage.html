<div style="font-family: 'Courier New', Courier, monospace; position: relative; width: 100%; height: 100%; overflow: hidden; background-color: #f4ecd8; background-image: url('[background]'); background-size: cover; background-position: center; border: 20px solid #8b5a2b; padding: 30px; box-sizing: border-box; box-shadow: inset 0 0 50px rgba(139, 90, 43, 0.3);">
    
    <div style="border: 1px dashed #8b5a2b; padding: 30px; text-align: center; height: 100%; border-radius: 10px;">
        
        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0" style="text-align: center;">
            <tr>
                <td align="center" valign="top" style="height: 180px;">
                    <div style="height: 90px; width: 100%; margin-bottom: 10px; background-image: url('[logo]'); background-size: contain; background-repeat: no-repeat; background-position: center;"></div>
                    <h1 style="font-size: 48px; color: #5c3a21; margin: 0; font-weight: normal; text-transform: uppercase; border-bottom: 2px solid #5c3a21; display: inline-block; padding-bottom: 10px;">Officially Certified</h1>
                </td>
            </tr>

            <tr>
                <td align="center" valign="middle" style="padding: 20px 40px;">
                    <p style="font-size: 22px; color: #4a2f1d; line-height: 2; margin: 0; font-style: italic;">
                        %body_text%
                    </p>
                </td>
            </tr>

            <tr>
                <td align="center" valign="bottom" style="height: 160px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td width="40%" align="center" valign="bottom">
                                <div style="font-size: 20px; color: #5c3a21;">[issue_date]</div>
                                <div style="border-top: 1px solid #8b5a2b; width: 150px; margin: 5px auto 0 auto; padding-top: 5px;">
                                    <strong style="font-size: 14px; color: #8b5a2b;">Date Issued</strong>
                                </div>
                                <p style="font-size: 11px; color: #a0816c; margin: 5px 0 0 0;">No. [certificate_code]</p>
                            </td>
                            <td width="20%" align="center" valign="bottom">
                            </td>
                            <td width="40%" align="center" valign="bottom">
                                <div style="width: 200px; height: 70px; margin: 0 auto; background-image: url('[signature]'); background-size: contain; background-repeat: no-repeat; background-position: center bottom;">
                                </div>
                                <div style="border-top: 1px solid #8b5a2b; width: 220px; margin: 5px auto 0 auto; padding-top: 5px;">
                                    <strong style="font-size: 15px; color: #5c3a21; display: block;">%issuer%</strong>
                                    <span style="font-size: 12px; color: #8b5a2b;">%signature_label%</span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</div>
