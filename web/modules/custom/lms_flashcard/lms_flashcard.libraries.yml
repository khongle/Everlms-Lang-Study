# No explicit `version:` on any of these — that field is meant for pinning
# genuinely third-party/vendored assets to a real semver, not first-party
# module JS/CSS under active development. Setting one (even a placeholder
# like "1.x") replaces Drupal's own auto-bumped cache-busting query string
# (which changes on every `drush cache:rebuild`) with that fixed literal, so
# a browser that already cached e.g. flashcard-import.js?v=1.x keeps serving
# its stale copy from before an edit, from the exact same URL, indefinitely.
# Leaving it unset means every cache rebuild forces browsers to refetch.
flashcard_study:
  css:
    theme:
      css/flashcard-study.css: {}
  js:
    js/flashcard-study.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

flashcard_import:
  css:
    theme:
      css/flashcard-import.css: {}
  js:
    js/flashcard-import.js: {}
  dependencies:
    - core/drupal
    - core/once

flashcard_pages:
  css:
    theme:
      css/flashcard-pages.css: {}

flashcard_export:
  js:
    js/flashcard-export.js: {}
  dependencies:
    - core/drupal
    - core/once

flashcard_my_decks:
  css:
    theme:
      css/flashcard-library.css: { weight: 1350 }
  js:
    js/flashcard-my-decks.js: {}
  dependencies:
    - core/drupal
    - core/once

flashcard_entity_form:
