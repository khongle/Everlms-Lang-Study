# Quick Edit (see QUICK_EDIT_STUDY_CARD_PLAN.md): lets a card's owner (or
# staff with "edit lms_course") edit it in a sidebar without leaving the
# study session. Gated by _user_is_logged_in only, like every other route in
# this file — FlashcardApiController::canQuickEditCard() does the real
# per-card access check ($card->access('update')), matching the "own
# content" convention used everywhere else in this controller rather than
# _entity_access, so a non-owner gets a clean 403 JSON response instead of
# Drupal's default access-denied page.
lms_flashcard.api_quick_edit_get:
  path: '/api/lms/flashcard/card/{lms_flashcard_card}/quick-edit'
  defaults:
    _controller: '\Drupal\lms_flashcard\Controller\FlashcardApiController::quickEditFormData'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]
  options:
    parameters:
      lms_flashcard_card:
        type: entity:lms_flashcard_card

lms_flashcard.api_quick_edit_save:
  path: '/api/lms/flashcard/card/{lms_flashcard_card}/quick-edit'
  defaults:
    _controller: '\Drupal\lms_flashcard\Controller\FlashcardApiController::quickEditSave'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]
  options:
    parameters:
      lms_flashcard_card:
        type: entity:lms_flashcard_card
