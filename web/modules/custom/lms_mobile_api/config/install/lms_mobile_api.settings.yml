# OAuth2 consumer credentials for the mobile app.
# Set these after creating a Simple OAuth consumer in Drupal admin:
#   /admin/config/services/consumer/add
# Then run: drush config:set lms_mobile_api.settings oauth_client_id <UUID>
#           drush config:set lms_mobile_api.settings oauth_client_secret <SECRET>
oauth_client_id: ''
oauth_client_secret: ''

# OTP session expiry in seconds (default: 900 = 15 minutes).
otp_expiry_seconds: 900

# Reset token expiry in seconds (default: 1800 = 30 minutes).
reset_token_expiry_seconds: 1800
