  methods: [GET]

lms_mobile_api.user.change_password:
  path: '/api/v1/user/change-password'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileAuthController::changePassword'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# ---------------------------------------------------------------------------
# Course APIs (Feature 02-04)
# ---------------------------------------------------------------------------

lms_mobile_api.courses.search:
  path: '/api/v1/courses/search'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::searchCourses'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [GET]

lms_mobile_api.categories:
  path: '/api/v1/categories'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::listCategories'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [GET]

lms_mobile_api.course.detail:
  path: '/api/v1/courses/{courseId}'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::getCourseDetail'
    _format: 'json'
  requirements:
    _access: 'TRUE'
    courseId: '\d+'
  methods: [GET]

lms_mobile_api.course.enroll_free:
  path: '/api/v1/courses/{courseId}/enroll-free'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::enrollFree'
    _format: 'json'
  requirements:
    _access: 'TRUE'
    courseId: '\d+'
  methods: [POST]

lms_mobile_api.dashboard:
  path: '/api/v1/dashboard'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::getDashboard'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [GET]

lms_mobile_api.my_courses:
  path: '/api/v1/my-courses'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileCourseController::getMyCourses'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [GET]

# ---------------------------------------------------------------------------
# Lesson / Quiz / Progress APIs (Feature 05-07)
# ---------------------------------------------------------------------------

lms_mobile_api.lesson.detail:
