lms_mobile_api.quiz.my_results:
  path: '/api/v1/quiz/my-results'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileLearningController::listMyQuizResults'
    _format: 'json'
  requirements:
    _access: 'TRUE'
  methods: [GET]

lms_mobile_api.progress.mark_complete:
  path: '/api/v1/progress/mark-complete'
  defaults:
    _controller: '\Drupal\lms_mobile_api\Controller\MobileLearningController::markLessonComplete'
    _format: 'json'
  requirements:
    _access: 'TRUE'
