lms_listening.import:
  path: '/manage/listening-passages/import'
  defaults:
    _form: '\Drupal\lms_listening\Form\ListeningImportForm'
    _title: 'Import Listening Passage'
  requirements:
    # Open to any authenticated user, matching lms_reading.import — see
    # ListeningImportForm's docblock.
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: TRUE

lms_listening.my_passages:
  path: '/learn/listening'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningController::myPassages'
    _title: 'Listening'
  requirements:
    _user_is_logged_in: 'TRUE'

lms_listening.start:
  # A distinct path (not nested under /learn/listening/) so it can never be
  # swallowed by lms_listening.listen's '/learn/listening/{lms_listening_passage}'
  # pattern — see ListeningStartForm's docblock for what this does.
  path: '/learn/listening-start'
  defaults:
    _form: '\Drupal\lms_listening\Form\ListeningStartForm'
    _title: 'Start Listening'
  requirements:
    _user_is_logged_in: 'TRUE'

lms_listening.listen:
  path: '/learn/listening/{lms_listening_passage}'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningController::listen'
    _title: 'Listen'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage

lms_listening.listen_passive:
  # Passive Listening's session shell (see PASSIVE_LISTENING_PLAN.md) —
  # renders only the first passage; js/listening-passive.js fetches the
  # rest from lms_listening.api_passive_next and updates this same page in
  # place, so a distinct path (not nested under /learn/listening/, same
  # reasoning as lms_listening.start above) isn't strictly required here,
  # but keeps it visually/structurally separate from lms_listening.listen.
  path: '/learn/listening-passive/{lms_listening_passage}'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningController::listenPassive'
    _title: 'Passive Listening'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage

lms_listening.questions:
  path: '/learn/listening/{lms_listening_passage}/questions'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningController::questions'
    _title: 'Comprehension'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage

lms_listening.review:
  path: '/learn/listening/{lms_listening_passage}/review/{lms_listening_attempt}'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningController::review'
    _title: 'Review'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage
      lms_listening_attempt:
        type: entity:lms_listening_attempt

lms_listening.api_submit_attempt:
  path: '/api/lms/listening/attempt'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::submitAttempt'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_listening.api_start:
  # AJAX counterpart to lms_listening.start (ListeningStartForm) — see
  # ListeningApiController::start()'s docblock. Also handles mode=passive
  # (see PASSIVE_LISTENING_PLAN.md), branching internally rather than a
  # separate route, since it's the same "build a queue, return where to go
  # next" shape either way.
  path: '/api/lms/listening/start'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::start'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_listening.api_passive_next:
  path: '/api/lms/listening/passive-next'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::passiveNext'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_listening.api_save_import_prompt:
  # Backs the standalone "Save prompt" button next to the Import form's
  # prompt textarea (js/listening-import.js) — writes straight into this
  # user's own private tempstore (ListeningImportForm reads it back for
  # #default_value) and does nothing else: no JSON parsing, no entity
  # created, no AI call of any kind, just persisting some text.
  path: '/api/lms/listening/save-import-prompt'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::saveImportPrompt'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_listening.api_quick_edit_get:
  # Quick Edit (narration audio upload) from the Active/Passive Listening
  # page — see ListeningApiController::quickEditFormData()/quickEditSave().
  # Gated the same "own content" way as every other endpoint in this file
  # (_user_is_logged_in only, per-entity access re-checked in the
  # controller via canQuickEditPassage()), so a non-owner gets a clean 403
  # JSON response instead of Drupal's default access-denied page.
  path: '/api/lms/listening/{lms_listening_passage}/quick-edit'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::quickEditFormData'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage

lms_listening.api_quick_edit_save:
  path: '/api/lms/listening/{lms_listening_passage}/quick-edit'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::quickEditSave'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]
  options:
    parameters:
      lms_listening_passage:
        type: entity:lms_listening_passage

lms_listening.music_library:
  # Background Music library — see BackgroundMusicTrack's docblock. Open to
  # any authenticated user, same as lms_listening.import: this page only
  # ever manages the current user's own uploads (BackgroundMusicController::
  # library() scopes the query to `uid`), so there's nothing to restrict.
  path: '/manage/listening-music'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\BackgroundMusicController::library'
    _title: 'Background Music'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: TRUE

lms_listening.api_music_upload:
  path: '/api/lms/listening/music'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\BackgroundMusicController::upload'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_listening.api_music_delete:
  path: '/api/lms/listening/music/{lms_listening_bg_track}/delete'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\BackgroundMusicController::delete'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]
  options:
    parameters:
      lms_listening_bg_track:
        type: entity:lms_listening_bg_track

lms_listening.api_bulk_delete:
  # Backs the "Delete selected" bar on /learn/listening (see
  # ListeningApiController::bulkDelete()) — per-entity access is still
  # re-checked server-side there, this route only gates on being logged in
  # at all, same as every other endpoint in this file.
  path: '/api/lms/listening/bulk-delete'
  defaults:
    _controller: '\Drupal\lms_listening\Controller\ListeningApiController::bulkDelete'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]
