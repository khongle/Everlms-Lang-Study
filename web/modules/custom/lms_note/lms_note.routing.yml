lms_note.save:
  path: '/api/lms/note/save'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::save'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_note.delete:
  path: '/api/lms/note/delete'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::delete'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_note.get:
  path: '/api/lms/note/get'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::getNote'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]

lms_note.sentence_list:
  path: '/api/lms/note/sentence-list'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::sentenceNotesList'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]

lms_note.upload_attachment:
  path: '/api/lms/note/upload-attachment'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::uploadAttachment'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_note.remove_attachment:
  path: '/api/lms/note/remove-attachment'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::removeAttachment'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [POST]

lms_note.my_notes:
  path: '/my-notes'
  defaults:
    _controller: '\Drupal\lms_note\Controller\NoteController::myNotes'
    _title: 'My Notes'
  requirements:
    _user_is_logged_in: 'TRUE'
