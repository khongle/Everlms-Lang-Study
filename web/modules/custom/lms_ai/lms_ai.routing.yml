lms_ai.settings:
  path: '/admin/config/lms/ai'
  defaults:
    _form: '\Drupal\lms_ai\Form\AiSettingsForm'
    _title: 'AI Platform Settings'
  requirements:
    _permission: 'administer site configuration'

lms_ai.course_builder_form:
  path: '/manage/courses/ai-builder'
  defaults:
    _form: '\Drupal\lms_ai\Form\CourseBuilderForm'
    _title: 'Build Course with AI'
  requirements:
    _permission: 'create lms_course'

lms_ai.engine_users_form:
  path: '/admin/everlms-ai-engine'
  defaults:
    _form: '\Drupal\lms_ai\Form\AiEngineUserForm'
    _title: 'EverLMS AI Engine'
  requirements:
    _permission: 'administer site configuration'

lms_ai.preview_users_json:
  path: '/admin/everlms-ai-engine/preview-users-json'
  defaults:
    _controller: '\Drupal\lms_ai\Controller\AiPreviewController::previewUsersJson'
    _title: 'Preview AI JSON'
  requirements:
    _permission: 'administer site configuration'
