# Public routes
lms_course.homepage:
  path: '/homepage'
  defaults:
    _controller: '\Drupal\lms_course\Controller\CoursePublicController::homepage'
    _title: 'EverLMS — Transform Your Future'
  requirements:
    _permission: 'access content'

lms_course.catalog:
  path: '/courses'
  defaults:
    _controller: '\Drupal\lms_course\Controller\CoursePublicController::catalog'
    _title: 'Browse Courses'
  requirements:
    _permission: 'access content'

lms_course.detail:
  path: '/courses/{lms_course}'
  defaults:
    _controller: '\Drupal\lms_course\Controller\CoursePublicController::detail'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      lms_course:
        type: entity:lms_course

lms_course.category:
  path: '/categories'
  defaults:
    _controller: '\Drupal\lms_course\Controller\CoursePublicController::categories'
    _title: 'Categories'
  requirements:
    _permission: 'access content'

lms_course.category_detail:
  path: '/categories/{taxonomy_term}'
  defaults:
    _controller: '\Drupal\lms_course\Controller\CoursePublicController::categoryDetail'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term

# Static pages
lms_course.about:
  path: '/about'
  defaults:
    _controller: '\Drupal\lms_course\Controller\PageController::about'
    _title: 'About Us'
  requirements:
    _permission: 'access content'

lms_course.pricing:
  path: '/pricing'
  defaults:
    _controller: '\Drupal\lms_course\Controller\PageController::pricing'
    _title: 'Pricing'
  requirements:
    _permission: 'access content'

lms_course.contact:
  path: '/contact'
  defaults:
    _controller: '\Drupal\lms_course\Controller\PageController::contact'
    _title: 'Contact Us'
  requirements:
    _permission: 'access content'

# Admin/Management routes
lms_course.admin_dashboard:
  path: '/manage'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::dashboard'
    _title: 'Admin Dashboard'
  requirements:
    _permission: 'administer site configuration'

lms_course.admin_courses:
  path: '/manage/courses'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::courseList'
    _title: 'Manage Courses'
  requirements:
    _permission: 'administer site configuration'

lms_course.admin_quizzes:
  path: '/manage/quizzes'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::quizList'
    _title: 'Manage Quizzes'
  requirements:
    _permission: 'administer site configuration'

lms_course.admin_orders:
  path: '/manage/orders'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::orderList'
    _title: 'Manage Orders'
  requirements:
    _permission: 'administer site configuration'

lms_course.admin_users:
  path: '/manage/users'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::userList'
    _title: 'Manage Users'
  requirements:
    _permission: 'administer site configuration'

lms_course.admin_reports:
  path: '/manage/reports'
  defaults:
    _controller: '\Drupal\lms_course\Controller\AdminController::reports'
    _title: 'Reports & Analytics'
  requirements:
    _permission: 'administer site configuration'

# User Profile
lms_course.profile:
  path: '/profile'
  defaults:
    _controller: '\Drupal\lms_progress\Controller\UserPortalController::profile'
    _title: 'My Profile'
  requirements:
    _user_is_logged_in: 'TRUE'
