global:
  version: 1.0.0
  css:
    theme:
      css/main.css: {}
      css/admin-fixes.css: {}
  js:
    js/main.js: { attributes: { defer: true } }
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
    - core/drupalSettings
    - lms_theme/bootstrap
    - lms_theme/inter-font
    - lms_theme/fontawesome

bootstrap:
  remote: https://cdn.jsdelivr.net
  version: 5.3.3
  license:
    name: MIT
    url: https://github.com/twbs/bootstrap/blob/main/LICENSE
    gpl-compatible: true
  css:
    base:
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: { type: external, minified: true }
  js:
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js: { type: external, minified: true, attributes: { defer: true } }

inter-font:
  css:
    base:
      https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap: { type: external }

fontawesome:
  css:
    base:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css: { type: external, minified: true }
