users_prompt: "Tôi muốn xây dựng một website training online với chủ đề là \"{{training_program}}\" cho thị trường ngôn ngữ {{langcode}}, xây dựng trên sản phẩm EverLMS.\r\nĐây là langcodes của toàn bộ website: {{langcodes_list}}.\r\nChương trình toàn bộ bằng ngôn ngữ {{langcode}}.\r\nNội dung chỉ tập trung nói về đề tài \"{{training_program}}\" chứ đừng giới thiệu hay quảng bá gì về EverLMS cả nhé.\r\n\r\nHãy tạo giúp tôi 10 user cho hệ thống, phân chia vào các role khác nhau, mỗi user 1 role và không lấy role authenticated hay administrator, trong đó ít nhất 5 user có role là teacher (hoặc instructor). Đây là danh sách roles hợp lệ trên hệ thống:\r\n{{roles_list}}\r\nChương trình toàn bộ bằng ngôn ngữ: {{langcode}}.\r\n\r\nTôi muốn bạn tạo giúp tôi nội dung từng user và gửi trả đúng duy nhất một mảng JSON thuần túy (không bọc trong markdown ```json). Format chính xác các cột như bên dưới:\r\n[\r\n  {\r\n    \"field_first_name\": \"string (Tên thật, ví dụ: John)\",\r\n    \"field_last_name\": \"string (Họ, ví dụ: Doe)\",\r\n    \"mail\": \"string (Email thực tế, duy nhất mạng tính học thuật)\",\r\n    \"name\": \"string (Username viết liền không dấu, ví dụ: johndoe)\",\r\n    \"pass\": \"string (Mật khẩu bảo mật, ví dụ: Secret@123)\",\r\n    \"field_job_title\": \"string (Chức danh chuyên gia, ví dụ: Senior Data Scientist)\",\r\n    \"field_company\": \"string (Tên công ty hoặc trường học)\",\r\n    \"field_location\": \"string (Thành phố, Quốc gia)\",\r\n    \"field_bio\": \"string long (Viết tiểu sử chi tiết phù hợp với role của user, dùng html <p> nếu đoạn văn dài)\",\r\n    \"roles\": [\"string\"]\r\n  }\r\n]"
users_image_prompt: "Tôi sẽ gọi api để tạo hình đại diện cho user. Yêu cầu tạo hình của tôi sẽ là:\r\n'Tôi đang xây dựng hệ thống training online cho việc \"{{training_program}}\". Tôi muốn bạn tạo giúp tôi 1 hình đại diện cho user có tên là \"{{user_name}}\" giới tính {{user_gender}}. Hình phải phù hợp với giới tính, với nội dung chương trình, hình ảnh cực kỳ sắc nét, độ phân giải cao và chân thực, không bị nhòe, không bị vẽ theo phong cách đặc biệt nào cả, nếu có để text thì text phải rõ ràng dễ đọc.'\r\nBạn hãy giúp tôi dịch nó sang tiếng Anh và cải thiện nó thành một Prompt chuyên nghiệp và chi tiết nhất để AI tạo ảnh có thể tạo ra được hình đại diện hoàn hảo nhất cho user này.\r\nHãy trả ra json thuần túy (không bọc trong thẻ markdown ```json) theo đúng cấu trúc dưới đây:\r\n{\r\n  \"subject\": \"String\", \r\n  \"object_detected\": \"String\",\r\n  \"description\": \"String\", \r\n  \"width\": \"integer\", \r\n  \"height\": \"integer\", \r\n  \"prompt\": \"String\", \r\n  \"dpi\": \"String\", \r\n  \"related_content_subject\": \"String\", \r\n  \"ocr_text\": \"String\", \r\n  \"keywords\": \"long_text\", \r\n  \"Image_category\": \"long_text\", \r\n  \"language\": \"{{langcode}}\", \r\n  \"Industry\": \"long_text\",  \r\n  \"mode\": \"long_text\",  \r\n  \"style\": \"long_text\",  \r\n  \"scene\": \"long_text\"\r\n}\r\n"
