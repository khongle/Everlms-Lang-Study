course_detail_prompt: "Tôi muốn xây dựng một website training online với chủ đề là \"{{training_program}}\", xây dựng trên sản phẩm EverLMS.\r\nĐây là langcodes của toàn bộ website {{langcodes_list}}.\r\nChương trình toàn bộ bằng ngôn ngữ có langcode là \"{{langcode}}\".\r\nNội dung chỉ tập trung nói về đề tài \"{{training_program}}\" chứ đừng giới thiệu hay quảng bá gì về EverLMS cả nhé.\r\nĐây là danh sách category -> course -> chapter -> lesson tôi đã nhờ chatGPT tạo:\r\n{{courses_list_suggestion}}\r\n\r\nĐây là cấu trúc category và course của tôi đã tạo\r\n{{categories_courses}}\r\nGio tôi cần tạo content cho course \"{{course_name}}\" trong category \"{{category_name}}\"\r\nChỉ trả ra JSON. \r\nCấu trúc trả ra sẽ là:\r\n[\r\n{\r\n\"\"{{langcode}}\"\": {\r\n\"\"course_title\"\": {{course_name}}, // Thay placeholder này bằng tên khóa học.\r\n\"\"short_description\"\": long text, // Text ngắn tóm tắt khóa học.\r\n\"\"description\"\": long text, // Mô tả đầy đủ chi tiết, trực quan và sâu sắc, CÓ THỂ BỌC THẺ HTML cho đẹp.\r\n\"\"what_you_will_learn\"\": long text, // Danh sách mục tiêu khóa học.\r\n\"\"prerequisites\"\": long text, // Yêu cầu đầu vào của khóa học.\r\n\"\"who_is_this_for\"\": long text, // Khóa học dành cho đối tượng nào.\r\n\"\"category\"\": string is category name,\r\n\"\"price_type\"\": string, // Nhận giá trị \"free\", \"paid\", hoặc \"membership\". Có ít nhất 5 course free.\r\n\"\"price\"\": number, // Giá của course (in USD). Nếu price_type là free thì price trả về 0.\r\n\"\"is_featured\"\": boolean, // Có ít nhất 4 course is_featured = true.\r\n\"\"is_bestseller\"\": boolean, // Bestseller course flag.\r\n\"\"duration_minutes\"\": integer, // Tổng thời lượng của khóa học TÍNH BẰNG PHÚT.\r\n\"\"meta_abstract\"\": string, // Tóm tắt ngắn gọn xuất hiện trong thẻ meta (tối đa 150 ký tự).\r\n\"\"meta_description\"\": string, // Tóm tắt meta description chuẩn SEO (tối đa 160 ký tự).\r\n\"\"meta_keywords\"\": string, // Danh sách các từ khóa chuẩn SEO cách nhau bằng dấu phẩy.\r\n\"\"og_description\"\": string, // Mô tả og:description (1-2 câu).\r\n\"\"og_determiner\"\": string // Từ xuất hiện trước tiêu đề.\r\n}\r\n}\r\n]\"\r\n"
