chapter_detail_prompt: "Tôi muốn xây dựng một website training online với chủ đề là \"{{training_program}}\", xây dựng trên sản phẩm EverLMS.\r\nĐây là langcodes của toàn bộ website {{langcodes_list}}.\r\nChương trình toàn bộ bằng ngôn ngữ có langcode là {{langcode}}.\r\nĐây là cấu trúc category và course của tôi\r\n{{categories_courses}}\r\n\r\nGiờ tôi muốn tạo chapter detail cho Chapter \"{{chapter_name}}\"\r\nChỉ trả ra JSON.\r\nCấu trúc trả ra sẽ là:\r\n{\r\n  \"course_id\": {{course_id}}, \r\n  \"chapter\" : [\r\n    {\r\n      \"{{langcode}}\": {\r\n        \"chapter_title\": {{chapter_name}},\r\n        \"chapter_description\": string,\r\n      },\r\n    } \r\n  ]\r\n} \r\n"
lesson_detail_prompt: "Tôi muốn xây dựng một website training online với chủ đề là \"{{training_program}}\", xây dựng trên sản phẩm EverLMS.\r\nĐây là langcodes của toàn bộ website {{langcodes_list}}.\r\nChương trình toàn bộ bằng ngôn ngữ có langcode là {{langcode}}.\r\nĐây là cấu trúc category và course của tôi\r\n{{categories_courses}}  \r\n\r\nGiờ tôi muốn tạo lesson detail cho Lesson \"{{lesson_name}}\"\r\nĐể bạn hiểu hơn đây là cấu trức chapter và lesson của course này \"{{chapters_lessons_tree}}\"\r\nChỉ trả ra JSON và không được bỏ machine nào vào như langcode.\r\nCấu trúc trả ra sẽ là:\r\n{\r\n  \"chapter_id\": {{chapter_id}},\r\n  \"lesson\": [\r\n    {\r\n      \"{{langcode}}\": {\r\n          \"lesson_title\": {{lesson_name}},\r\n          \"lesson_detail\": long text, // chứa nội dung của lesson phải đầy đủ, rõ ràng, dùng html, nội dung nên chia làm nhiều đoạn với các tag như <h>, <p>, <ul>, <ol>,<li>, <br/>, ... để hiển thị, không dùng \\n, mỗi đoạn không quá dài, không quá 100 word để người đọc dễ đọc dễ nắm bắt,\r\n          \"lesson_description\": long text,\r\n          \"youtube_link\": \"một số từ khóa mô tả chi tiết để tìm video phù hợp cho nội dung của lesson này trên youtube, riêng field này hãy cung cấp giúp tôi từ khóa tiếng anh để có thể dễ video youtube phù hợp nhất, cố gắng cho tôi từ khóa có nghĩa, phù hợp với nội dung và phù hợp với ý nghĩa của hệ thống và đảm bảo tôi có thể dễ dàng tìm được những youtube video phù hợp,\"\r\n          \"meta_abstract\": string, // Tóm tắt ngắn gọn và súc tích về nội dung của trang, tốt nhất là tối đa 150 ký tự. Trong khi thẻ meta mô tả có thể được các công cụ tìm kiếm sử dụng để hiển thị một đoạn trích về trang trong kết quả tìm kiếm, thì thẻ tóm tắt có thể được sử dụng để lưu trữ tóm tắt về trang\r\n          \"meta_description\": string, // Tóm tắt ngắn gọn và súc tích về nội dung trang, tối đa 160 ký tự. Thẻ meta mô tả có thể được các công cụ tìm kiếm sử dụng để hiển thị đoạn trích về trang trong kết quả tìm kiếm\r\n          \"meta_keywords\": string, // Danh sách các từ khóa được phân cách bằng dấu phẩy về trang.\r\n          \"og_description\": string, // Mô tả nội dung từ một đến hai câu.\r\n          \"og_determiner\": string, // Từ xuất hiện trước tiêu đề nội dung trong câu.\r\n        },\r\n    }\r\n  ]\r\n}\r\n"
slide_content_prompt: "Tôi muốn xây dựng một hệ thống trainining  với chủ đề là \"{{training_program}}\", xây dựng trên sản phẩm EverLMS.\r\nNội dung chỉ tập trung nói về đề tài \"{{training_program}}\" chứ đừng giới thiệu hay quảng bá gì về EverLMS cả nhé.\r\n\r\nCấu trúc chương trình gồm: Course => Chapter => Lesson. Tôi đã có sẵn cấu trúc này. Giờ tôi cần bạn tạo nội dung slide content cho từng lesson.\r\n\r\n  Nhiệm vụ của bạn:\r\n  - Tạo nội dung cho Lesson \"{{lesson_name}}\" trong Chapter \"{{chapter_name}}\" của Course \"{{course_name}}\".\r\n  - Để tham khảo, đây là danh sách tất cả course: \"{{courses_list}}\"\r\n  - Đây là danh sách các chapter trong course \"{{course_name}}\": \"{{chapter_list}}\"\r\n  - Đây là danh sách các lesson trong chapter \"{{chapter_name}}\": \"{{lesson_list}}\"\r\n\r\nYêu cầu khi viết:\r\n- Nội dung bằng ngôn ngữ có langcode là **{{langcode}}**, phong cách **chuyên nghiệp, dễ hiểu, thực tế **.\r\n- Về tổng thể, nội dung phải đầy đủ, rõ ràng, có bố cục:\r\n  + Giới thiệu\r\n  + Nội dung chính\r\n  + Ví dụ minh họa\r\n  + Ứng dụng thực tế\r\n  + Kết luận & thảo luận\r\n  + Và bạn chủ động thấy cần thêm bớt gì phù hợp với bài học thì cứ thêm\r\n\r\n- Chia thành **5–50 slide** tùy theo nội dung của lesson dài hay ngắn, \r\n- Mỗi slide được chia thành nhiều line/paragraph với mỗi line/paragraph thì không quá dài, với nội dung độc lập, tinh gọn để dễ truyền tải, gợi mở cho người đọc và cũng là ý để người trình bày có thể giải thích thêm.\r\n- Dùng HTML để trình bày nội dung ví dụ <strong>, <p>, <ul>, <ol>, <li>, <p>, …\r\n- Lấy ví dụ, số liệu, tình huống thực tế từ môi trường \"{{training_program}}\".\r\n\r\nOutput chỉ trả về JSON theo chuẩn dưới đây, không kèm text ngoài JSON:\r\n{\r\n  \"slide_content\": [\r\n    {\r\n      \"title\": \"...\",\r\n      \"html\": \"<p>...</p><ul><li>...</li><li>...</li><li>...</li>...</ul><p>...</p>....\"\r\n    },\r\n    {\r\n      \"title\": \"...\",\r\n      \"html\": \"<p>...</p><ul><li>...</li><li>...</li><li>...</li>...</ul><p>...</p>....\"\r\n    },\r\n    …\r\n  ]\r\n}\r\n"
